# 운영(https 배포) 설정: 실행할 때 --spring.profiles.active=prod
#   DB 주소·비밀번호는 환경 변수로 넣는다(파일에 적지 않음)
#     DB_URL=jdbc:mysql://DB주소:3306/buildup?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#     DB_USERNAME=buildup
#     DB_PASSWORD=...
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:buildup}
spring.datasource.password=${DB_PASSWORD}

# 운영에서는 데모 데이터를 넣지 않는다
buildup.seed-demo=false

# https 앞단(Nginx 등)을 거쳐 들어올 때 원래 주소(https://도메인)를 알아내
# 사진·첨부 파일 주소가 https로 만들어지게 한다
server.forward-headers-strategy=framework

# 웹 대시보드 주소만 허용(예: https://dashboard.buildup.kr)
buildup.cors-origins=${CORS_ORIGINS:https://localhost}

# 사진·첨부 파일 저장 폴더(서버에서 백업할 폴더)
buildup.upload-dir=${UPLOAD_DIR:uploads}

# 오류 응답에 서버 내부 정보를 싣지 않는다
server.error.include-stacktrace=never
server.error.include-message=never

# 휴대폰 알림 키 파일 위치(예: /opt/buildup/firebase-key.json, 권한 600)
buildup.firebase-key=${FIREBASE_KEY:firebase-key.json}
