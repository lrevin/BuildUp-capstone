# 깃허브에 올릴 때마다 자동으로 서버 테스트와 앱 검사를 돌린다(GitHub Actions)
# 결과: 저장소 → Actions 탭(초록 ✔ 통과 / 빨간 ✘ 실패)
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  server:
    name: 서버 빌드·테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buildup-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트(메모리 DB 사용, MySQL 필요 없음)
        run: ./gradlew test --no-daemon
      - name: 실행 파일(jar) 만들기
        run: ./gradlew bootJar --no-daemon
      - name: 테스트 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: buildup-server/build/reports/tests/test

  app:
    name: 앱 타입·코드 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuildUpApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: BuildUpApp/package-lock.json
      - run: npm ci --ignore-scripts
      - name: 타입 검사(TypeScript)
        run: npx tsc --noEmit
      - name: 코드 규칙 검사(ESLint)
        run: npx eslint src App.tsx
      - name: 자동 테스트(공사 종류 검색)
        run: npx jest __tests__/workTypes.test.ts
